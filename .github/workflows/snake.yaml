name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Executa a cada 12 horas
  workflow_dispatch: # Permite rodar o script manualmente

jobs:
  build:
    name: Update Snake Data
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão obrigatória para salvar o arquivo no GitHub
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: rsbezerra07
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#50E6FF&color_dots=#161b22,#F25022,#7FBA00,#00A4EF,#FFB900

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}