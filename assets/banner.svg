<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro moderno -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Gradiente de destaque para o texto e detalhes (Microsoft Azure Blue) -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="50%" stop-color="#50E6FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Padrão de Grid Tecnológico -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.45" />
    </pattern>

    <!-- Brilho difuso de fundo -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Fundo Principal com bordas arredondadas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />

  <!-- Grid de fundo -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Efeitos de iluminação ambiente (Glow spots) -->
  <circle cx="150" cy="60" r="130" fill="#0078D4" opacity="0.18" filter="url(#glow)" />
  <circle cx="1050" cy="260" r="160" fill="#2563EB" opacity="0.15" filter="url(#glow)" />

  <!-- Borda externa com gradiente sutil -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Elemento de Terminal: Dots no canto superior esquerdo -->
  <g transform="translate(45, 35)">
    <circle cx="0" cy="0" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="20" cy="0" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="40" cy="0" r="6" fill="#10b981" opacity="0.8" />
    <text x="65" y="4" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Fira Code&#39;, monospace" font-size="12" fill="#64748b" letter-spacing="1">PROFILE.PS1</text>
  </g>

  <!-- Prompt decorativo estilo PowerShell -->
  <g transform="translate(85, 120)">
    <text font-family="&#39;Fira Code&#39;, &#39;Cascadia Code&#39;, Consolas, monospace" font-size="18" fill="#50E6FF" opacity="0.9">PS ></text>
    <text x="50" font-family="&#39;Fira Code&#39;, &#39;Cascadia Code&#39;, Consolas, monospace" font-size="18" fill="#94a3b8">Connect-AzAccount -Identity</text>
  </g>

  <!-- Nome Principal -->
  <text x="85" y="185" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="46" fill="#ffffff" letter-spacing="-0.5">
    Roger Bezerra
  </text>

  <!-- Subtítulo / Especialidades -->
  <g transform="translate(85, 230)">
    <text font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="16" fill="url(#accentGradient)" letter-spacing="2">
      CLOUD INFRASTRUCTURE
    </text>
    <circle cx="250" cy="-5" r="3" fill="#64748b" />
    <text x="270" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="16" fill="url(#accentGradient)" letter-spacing="2">
      MODERN WORKPLACE
    </text>
    <circle cx="495" cy="-5" r="3" fill="#64748b" />
    <text x="515" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="16" fill="url(#accentGradient)" letter-spacing="2">
      ENDPOINT AUTOMATION
    </text>
  </g>

  <!-- Linha de detalhe inferior minimalista -->
  <line x1="85" y1="260" x2="1115" y2="260" stroke="#1e293b" stroke-width="1" />

  <!-- Marcador de status no canto inferior direito -->
  <g transform="translate(980, 285)">
    <circle cx="0" cy="0" r="4.5" fill="#10b981" />
    <text x="14" y="4" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.5">Focus: Microsoft Cloud</text>
  </g>
</svg>